<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Panel · EpicOutlet.es</title>
<meta name="theme-color" content="#16161A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16161A;--ink2:#3D3D45;--muted:#5C5C64;--line:#E4E4E8;--soft:#F4F4F6;--bg:#F6F6F8;--brand:#FF6A00;--brand-soft:#FFF1E7;--brand-dark:#B43C00;--ok:#1D6B3A;--ok-soft:#E3F2E8;--err:#B42318;--err-soft:#FDECEA;--head:'Space Grotesk',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--head);letter-spacing:-.02em;margin:0}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.top{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;padding:12px 16px calc(12px);display:flex;align-items:center;gap:12px}
.logo{font-family:var(--head);font-weight:700;font-size:20px;flex:1}.logo b{color:var(--brand)}.logo small{font-size:13px;color:#A9A9B1;font-weight:500;margin-left:6px}
.top a,.top button{color:#fff;background:#2B2B31;border:0;border-radius:10px;padding:8px 12px;font-size:14px;text-decoration:none;min-height:40px;display:inline-flex;align-items:center}
.tabs{display:flex;gap:6px;padding:12px 16px 0;max-width:980px;margin:0 auto;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;min-height:44px}
.tabs button.on{background:var(--ink);color:#fff}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:0;font-weight:600;font-size:15px;text-decoration:none}
.btn:disabled{opacity:.55;cursor:default}
.b-brand{background:var(--brand);color:var(--ink);font-weight:700}
.b-dark{background:var(--ink);color:#fff}
.b-line{background:#fff;box-shadow:inset 0 0 0 1px var(--ink)}
.b-ghost{background:var(--soft)}
.b-danger{background:#fff;color:var(--err);box-shadow:inset 0 0 0 1px #F2B8B5}
.full{width:100%}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink2)}
.in{width:100%;min-height:48px;border-radius:12px;border:1px solid #C9C9CF;padding:0 14px;font-size:16px;background:#fff;font-weight:400;color:var(--ink)}
textarea.in{padding:12px 14px;min-height:120px;resize:vertical;line-height:1.5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px;color:var(--muted)}
.msg{border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.err{background:var(--err-soft);color:var(--err)}
.msg.info{background:var(--brand-soft);color:var(--ink2)}
.check{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;min-height:44px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--ink)}
.prow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border:0}
.thumb{width:64px;height:64px;border-radius:12px;background:var(--soft);flex:0 0 64px;object-fit:contain;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);overflow:hidden}
.pinfo{flex:1;min-width:0}
.pname{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px}
.t-pub{background:var(--ok-soft);color:var(--ok)}.t-bor{background:var(--soft);color:var(--muted)}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.im{position:relative;border-radius:14px;overflow:hidden;background:var(--soft);aspect-ratio:1/1;border:2px solid transparent}
.im.main{border-color:var(--brand)}
.im img{width:100%;height:100%;object-fit:contain;background:#fff}
.im .ctr{position:absolute;inset:auto 6px 6px 6px;display:flex;gap:6px;justify-content:space-between}
.im .ctr button{width:36px;height:36px;border-radius:10px;border:0;background:rgba(22,22,26,.85);color:#fff;font-size:16px}
.im .lbl{position:absolute;top:6px;left:6px;background:var(--brand);color:var(--ink);font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.addimg{border:2px dashed #C9C9CF;border-radius:14px;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;text-align:center;padding:8px}
.margin{font-size:13px;font-weight:600}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
pre{background:var(--ink);color:#E9E9EE;border-radius:14px;padding:14px;font-size:11.5px;line-height:1.45;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:0}
ol.steps{margin:0;padding-left:22px;line-height:1.6}
ol.steps li{margin-bottom:8px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,140px);background:var(--ink);color:#fff;padding:13px 20px;border-radius:14px;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .3s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{transform:translate(-50%,0)}
.sticky-save{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 8px;display:flex;gap:10px}
.sticky-save .btn{flex:1}
@media (max-width:640px){.g2,.g3{grid-template-columns:1fr}.g3.keep{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body>
<div class="top">
  <div class="logo">Epic<b>Outlet</b><small>Panel</small></div>
  <a href="/" target="_blank" rel="noopener">Ver tienda</a>
  <button id="salir" hidden>Salir</button>
</div>
<nav class="tabs" id="tabs" hidden>
  <button data-v="lista">Productos</button>
  <button data-v="importar">Importar</button>
  <button data-v="atajo">Atajo iPhone</button>
  <button data-v="ajustes">Ajustes</button>
</nav>
<main id="app"><div class="empty">Cargando…</div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/config.js"></script>
<script>
/* ===========================================================
   Panel de EpicOutlet.es
   =========================================================== */
const CATS = { relojes: 'Relojes', hogar: 'Hogar', bebe: 'Bebé y juguetes', mascotas: 'Mascotas', deporte: 'Deporte', tecnologia: 'Tecnología', belleza: 'Belleza' };
const ESTADOS = ['Nuevo', 'Caja abierta', 'Reprecintado', 'Liquidación'];
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = n => (n == null || n === '' || isNaN(n)) ? '—' : Number(n).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const nOrNull = v => { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
let tt;
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('show'), 2600); }

const CFG = typeof EO_CONFIG !== 'undefined' ? EO_CONFIG : {};
/* ---------- Margen automático ---------- */
const AJ_DEF = { margen: 40, iva: 21, costeConIva: false, redondeo: '90', usarPvp: true, cat: {} };
let AJ = { ...AJ_DEF };
async function cargarAjustes() {
  try {
    const { data, error } = await sb.from('ajustes').select('valor').eq('clave', 'precios').maybeSingle();
    if (error) throw error;
    if (data) AJ = { ...AJ_DEF, ...data.valor, cat: { ...((data.valor || {}).cat || {}) }, _guardado: true };
    AJ._db = true;
  } catch (e) {
    try { const l = JSON.parse(localStorage.getItem('eo_ajustes') || 'null'); if (l) AJ = { ...AJ_DEF, ...l, _guardado: true }; } catch (x) {}
    AJ._db = false;
  }
}
async function guardarAjustes() {
  const v = { margen: AJ.margen, iva: AJ.iva, costeConIva: AJ.costeConIva, redondeo: AJ.redondeo, usarPvp: AJ.usarPvp, cat: AJ.cat };
  try { localStorage.setItem('eo_ajustes', JSON.stringify(v)); } catch (e) {}
  const { error } = await sb.from('ajustes').upsert({ clave: 'precios', valor: v });
  AJ._db = !error; AJ._guardado = true;
  return !error;
}
const margenDe = cat => (AJ.cat && AJ.cat[cat] != null && AJ.cat[cat] !== '') ? Number(AJ.cat[cat]) : Number(AJ.margen);
const costeSinIva = c => AJ.costeConIva ? c / (1 + AJ.iva / 100) : c;
function redondear(x) {
  if (AJ.redondeo === 'no') return Math.round(x * 100) / 100;
  const fin = AJ.redondeo === '99' ? 0.01 : 0.10;
  let r = Math.ceil(x) - fin; if (r < x - 1e-9) r += 1;
  return Math.round(r * 100) / 100;
}
/* Coste (sin IVA) + tu margen + IVA, redondeado. Nunca por debajo del margen. */
function precioSugerido(coste, cat) {
  const c = nOrNull(coste); if (!c || c <= 0) return null;
  return redondear(costeSinIva(c) * (1 + margenDe(cat) / 100) * (1 + AJ.iva / 100));
}
function ganancia(coste, precio) {
  const c = nOrNull(coste), p = nOrNull(precio); if (!c || !p) return '';
  const cs = costeSinIva(c), neto = p / (1 + AJ.iva / 100) - cs;
  return `Ganas ${eur(neto)} por unidad, sin IVA (${Math.round(neto / cs * 100)} % sobre el coste)`;
}
const fmtPrecio = n => n == null ? '' : n.toFixed(2).replace('.', ',');
const ivaTxt = () => AJ.costeConIva ? 'coste con IVA' : `+ IVA ${AJ.iva} %`;

let sb = null, session = null, vista = 'lista', PRODS = [], PRIV = {}, ed = null, filtro = 'todos', busca = '';

/* Producto que llega desde el atajo del iPhone */
(function leerHash() {
  const h = location.hash;
  if (h.startsWith('#importar=')) {
    try { const d = JSON.parse(decodeURIComponent(h.slice(10))); sessionStorage.setItem('eo_pend', JSON.stringify(d)); } catch (e) { sessionStorage.setItem('eo_err', 'No se ha podido leer el producto que ha enviado el atajo.'); }
    history.replaceState(null, '', location.pathname);
  } else if (h.startsWith('#lista=')) {
    sessionStorage.setItem('eo_lista', decodeURIComponent(h.slice(7)));
    history.replaceState(null, '', location.pathname);
  } else if (h.startsWith('#error=')) {
    sessionStorage.setItem('eo_err', 'El atajo no ha podido leer la página: ' + decodeURIComponent(h.slice(7)));
    history.replaceState(null, '', location.pathname);
  }
})();

/* ---------- Arranque ---------- */
async function iniciar() {
  if (!CFG.supabaseUrl || !CFG.supabaseKey || !window.supabase) {
    $('#app').innerHTML = `<div class="card stack"><h2>Falta conectar Supabase</h2><p class="muted">Rellena <code>config.js</code> con la dirección y la clave pública de tu proyecto de Supabase y vuelve a subirlo a GitHub.</p></div>`;
    return;
  }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true } });
  const { data } = await sb.auth.getSession();
  session = data.session;
  sb.auth.onAuthStateChange((_e, s) => { session = s; });
  if (!session) return pintarLogin();
  await entrar();
}

function pintarLogin(error) {
  $('#tabs').hidden = true; $('#salir').hidden = true;
  $('#app').innerHTML = `<div class="card stack" style="max-width:420px;margin:30px auto">
    <h1 style="font-size:28px">Entrar al panel</h1>
    ${sessionStorage.getItem('eo_pend') || sessionStorage.getItem('eo_lista') ? '<div class="msg info">Tienes un producto del atajo esperando. Entra para revisarlo.</div>' : ''}
    ${error ? `<div class="msg err">${esc(error)}</div>` : ''}
    <form id="login" class="stack">
      <label class="f">Correo<input class="in" type="email" name="email" autocomplete="username" required></label>
      <label class="f">Contraseña<input class="in" type="password" name="pass" autocomplete="current-password" required></label>
      <button class="btn b-dark full" type="submit">Entrar</button>
    </form></div>`;
  $('#login').onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target); const b = e.target.querySelector('button'); b.disabled = true; b.textContent = 'Entrando…';
    const { data, error } = await sb.auth.signInWithPassword({ email: f.get('email'), password: f.get('pass') });
    if (error) return pintarLogin('Correo o contraseña incorrectos.');
    session = data.session; await entrar();
  };
}

async function entrar() {
  const { data: ok, error } = await sb.rpc('es_admin');
  if (error || ok !== true) { await sb.auth.signOut(); return pintarLogin('Este usuario no tiene permiso de administrador. Añade su correo a la tabla «admins» en Supabase.'); }
  $('#tabs').hidden = false; $('#salir').hidden = false;
  await Promise.all([cargar(), cargarAjustes()]);
  const pend = sessionStorage.getItem('eo_pend'), err = sessionStorage.getItem('eo_err'), lista = sessionStorage.getItem('eo_lista');
  if (pend) { sessionStorage.removeItem('eo_pend'); await abrirDelAtajo(JSON.parse(pend)); }
  else if (lista) { sessionStorage.removeItem('eo_lista'); await abrirEnlace(lista); }
  else if (err) { sessionStorage.removeItem('eo_err'); vista = 'importar'; pintar(); toast(err); }
  else pintar();
}

async function cargar() {
  const [{ data: p, error: e1 }, { data: v }] = await Promise.all([
    sb.from('productos').select('*').order('creado', { ascending: false }),
    sb.from('productos_privado').select('*')
  ]);
  if (e1) { toast('Error al cargar los productos'); PRODS = []; return; }
  PRODS = p || []; PRIV = {}; (v || []).forEach(x => PRIV[x.producto_id] = x);
}

function pintar() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === vista && !ed));
  if (ed) return pintarEditor();
  if (vista === 'importar') return pintarImportar();
  if (vista === 'atajo') return pintarAtajo();
  if (vista === 'ajustes') return pintarAjustes();
  if (vista === 'lote' && LOTE) return pintarLote();
  pintarLista();
}

/* ---------- Lista de productos ---------- */
function pintarLista() {
  const q = busca.toLowerCase();
  const list = PRODS.filter(p => (filtro === 'todos' || (filtro === 'pub' ? p.publicado : !p.publicado)) && (!q || p.nombre.toLowerCase().includes(q)));
  const nPub = PRODS.filter(p => p.publicado).length;
  $('#app').innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <div><h1 style="font-size:26px">Productos</h1><div class="small">${PRODS.length} en total · ${nPub} publicados</div></div>
      <button class="btn b-brand" id="nuevo">+ Nuevo</button>
    </div>
    ${AJ._guardado ? '' : '<div class="msg info" style="margin-bottom:14px">Pon tu margen de beneficio en <a href="#" id="irAjustes" style="font-weight:700">Ajustes</a> y los productos que importes llegarán ya con su precio de venta.</div>'}
    <div class="card" style="padding:12px 18px">
      <div class="row" style="margin-bottom:6px">
        <input class="in" id="busca" placeholder="Buscar producto…" value="${esc(busca)}" style="flex:1 1 200px">
        <select class="in" id="filtro" style="flex:0 1 170px"><option value="todos">Todos</option><option value="pub">Publicados</option><option value="bor">Borradores</option></select>
      </div>
      ${list.length ? list.map(p => `
        <div class="prow">
          ${p.imagenes && p.imagenes[0] ? `<img class="thumb" src="${esc(p.imagenes[0])}" alt="" loading="lazy">` : '<div class="thumb">Sin foto</div>'}
          <div class="pinfo">
            <div class="pname">${esc(p.nombre)}</div>
            <div class="small">${eur(p.precio)} · stock ${p.stock} · ${esc(CATS[p.categoria] || p.categoria)}</div>
            <span class="tag ${p.publicado ? 't-pub' : 't-bor'}">${p.publicado ? 'Publicado' : 'Borrador'}</span>
          </div>
          <button class="btn b-ghost" data-edit="${p.id}" style="min-height:44px;padding:0 14px">Editar</button>
        </div>`).join('') : `<div class="empty">${PRODS.length ? 'Ningún producto coincide.' : 'Todavía no hay productos. Importa uno desde un proveedor o crea uno nuevo.'}</div>`}
    </div>`;
  $('#filtro').value = filtro;
  $('#filtro').onchange = e => { filtro = e.target.value; pintarLista(); };
  $('#busca').oninput = e => { busca = e.target.value; const pos = e.target.selectionStart; pintarLista(); const i = $('#busca'); i.focus(); i.setSelectionRange(pos, pos); };
  $('#nuevo').onclick = () => abrirEditor(vacio());
  if ($('#irAjustes')) $('#irAjustes').onclick = ev => { ev.preventDefault(); vista = 'ajustes'; pintar(); };
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => abrirEditor(desdeFila(PRODS.find(p => p.id === b.dataset.edit))));
}

/* ---------- Importar ---------- */
function pintarImportar() {
  $('#app').innerHTML = `
    <div class="card stack">
      <h1 style="font-size:24px">Importar de un proveedor</h1>
      <p class="muted" style="margin:0">Pega el enlace de <strong>un producto</strong> o de <strong>una categoría entera</strong>. Leo el nombre, las fotos, el precio y la descripción con tu margen ya aplicado.</p>
      <form id="leer" class="stack">
        ${LOTE ? `<div class="msg info">Tienes una lista abierta: <a href="#" id="volverLote" style="font-weight:700">${esc(LOTE.titulo)} (${LOTE.productos.length} productos)</a></div>` : ''}
        <label class="f">Enlace del producto o de la categoría<input class="in" name="url" type="url" inputmode="url" placeholder="https://proveedor.com/collections/..." required></label>
        <button class="btn b-dark" type="submit">Leer producto</button>
      </form>
      <div id="leerMsg"></div>
    </div>
    <div class="card stack">
      <h2 style="font-size:19px">¿El proveedor pide iniciar sesión para ver precios?</h2>
      <p class="muted" style="margin:0">Usa el <a href="#" id="irAtajo" style="font-weight:600">atajo del iPhone</a>: lee la página tal como la ves tú en Safari, con tu sesión abierta.</p>
    </div>`;
  $('#irAtajo').onclick = e => { e.preventDefault(); vista = 'atajo'; pintar(); };
  if ($('#volverLote')) $('#volverLote').onclick = e => { e.preventDefault(); vista = 'lote'; pintar(); };
  $('#leer').onsubmit = async e => {
    e.preventDefault(); const url = new FormData(e.target).get('url'); const b = e.target.querySelector('button');
    b.disabled = true; b.textContent = 'Leyendo…'; $('#leerMsg').innerHTML = '';
    try {
      const d = await leerUrl(url);
      if (d.tipo === 'lista') abrirLote(d); else abrirEditor(desdeImportadoConPrecio(d));
    } catch (err) {
      $('#leerMsg').innerHTML = `<div class="msg err">${esc(err.message)}</div>`;
      b.disabled = false; b.textContent = 'Leer producto';
    }
  };
}

/* ---------- Atajo del iPhone ---------- */
// Este código se ejecuta dentro de la página del proveedor, en Safari.
function atajoFn(ORIGEN) {
  (async () => {
    const aqui = location.href.split('#')[0];
    let lista = /\/(collections?|categor[a-z]*|category|c)\/[^/]+/i.test(location.pathname) && !/\/products?\/[^/]+/i.test(location.pathname);
    for (const s of document.querySelectorAll('script[type="application/ld+json"]')) {
      try { const j = JSON.parse(s.textContent); const t = [].concat(j, (j && j['@graph']) || []).map(x => [].concat((x && x['@type']) || []).join(' ')).join(' '); if (/\bProduct\b/.test(t) && !/ItemList/.test(t)) { lista = false; break; } if (/ItemList/.test(t)) lista = true; } catch (e) {}
    }
    if (lista) { completion(ORIGEN + '/admin/#lista=' + encodeURIComponent(aqui)); return; }
    const d = { url: aqui, nombre: '', precio: null, moneda: '', imagenes: [], descripcion: '', marca: '', sku: '', caracteristicas: {} };
    const limpio = t => String(t == null ? '' : t).replace(/<br\s*\/?>|<\/p>/gi, '\n').replace(/<[^>]*>/g, ' ').replace(/&nbsp;/gi, ' ').replace(/&amp;/gi, '&').replace(/[ \t]+/g, ' ').replace(/\s*\n\s*/g, '\n').trim();

            <div class="small">${esc(estadoLote(p))} · ${esc(CATS[c])}${p.ya ? ' · <strong>Ya importado</strong>' : ''}${p.disponible === false ? ' · <strong>Agotado</strong>' : ''}</div>
          </div>
        </label>`; }).join('') || '<div class="empty">Ningún producto coincide.</div>'}
      ${L.hayMas ? `<button class="btn b-line full" id="masLote" style="margin-top:12px" ${L.corriendo ? 'disabled' : ''}>Cargar más productos de esta categoría</button>` : ''}
    </div>
    <div class="sticky-save">
      ${L.corriendo ? '<button class="btn b-danger" id="pararLote">Parar</button>' : `<button class="btn b-brand" id="impLote" ${nSel ? '' : 'disabled'}>Importar ${nSel} producto${nSel === 1 ? '' : 's'}</button>`}
    </div>`;
  pintarProgreso();

  const re = () => { const y = window.scrollY; pintarLote(); window.scrollTo(0, y); };
  $('#cerrarLote').onclick = () => { LOTE = null; vista = 'lista'; pintar(); };
  $('#irAj').onclick = e => { e.preventDefault(); vista = 'ajustes'; pintar(); };
  $('#oCat').onchange = e => { o.cat = e.target.value; re(); };
  $('#oEst').onchange = e => { o.estado = e.target.value; re(); };
  $('#oStock').onchange = e => { o.stock = Math.max(0, parseInt(e.target.value, 10) || 0); };
  $('#oFotos').onchange = e => { o.fotos = +e.target.value; };
  $('#oCopiar').onchange = e => { o.copiar = e.target.checked; };
  $('#oPub').onchange = e => { o.publicar = e.target.checked; };
  $('#oAgot').onchange = e => { o.agotados = e.target.checked; re(); };
  $('#qLote').oninput = e => { L.q = e.target.value; const pos = e.target.selectionStart; re(); const q = $('#qLote'); q.focus(); q.setSelectionRange(pos, pos); };
  $('#selTodos').onclick = () => { L.productos.filter(visibleLote).forEach(p => { if (!p.ya && p.precio > 0) p.sel = true; }); re(); };
  $('#selNinguno').onclick = () => { L.productos.filter(visibleLote).forEach(p => p.sel = false); re(); };
  document.querySelectorAll('[data-i]').forEach(c => c.onchange = () => { L.productos[+c.dataset.i].sel = c.checked; const n = L.productos.filter(p => p.sel && !p.ya && visibleLote(p)).length; const b = $('#impLote'); if (b) { b.disabled = !n; b.textContent = `Importar ${n} producto${n === 1 ? '' : 's'}`; } });
  if ($('#masLote')) $('#masLote').onclick = cargarMasLote;
  if ($('#impLote')) $('#impLote').onclick = importarLote;
  if ($('#pararLote')) $('#pararLote').onclick = () => { L.parar = true; $('#pararLote').disabled = true; $('#pararLote').textContent = 'Parando…'; };
}

function pintarProgreso() {
  const L = LOTE, box = $('#prog'); if (!box || !L) return;
  if (!L.total) { box.innerHTML = ''; return; }
  const hechos = L.hechos + L.errores.length, pc = Math.round(hechos / L.total * 100);
  box.innerHTML = `<div class="card stack">
    <div class="row" style="justify-content:space-between"><strong>${L.corriendo ? 'Importando…' : 'Importación terminada'}</strong><span class="small">${hechos} de ${L.total}</span></div>
    <div style="height:10px;background:var(--soft);border-radius:999px;overflow:hidden"><div style="height:100%;width:${pc}%;background:var(--brand);transition:width .3s"></div></div>
    <div class="small">${L.hechos} importado${L.hechos === 1 ? '' : 's'}${L.errores.length ? ` · ${L.errores.length} con error` : ''}${L.corriendo ? ' · No cierres esta pantalla' : ''}</div>
    ${!L.corriendo && L.errores.length ? `<details><summary class="small" style="cursor:pointer">Ver errores</summary><div class="small">${L.errores.map(esc).join('<br>')}</div></details>` : ''}
  </div>`;
}

async function cargarMasLote() {
  const L = LOTE, b = $('#masLote'); b.disabled = true; b.textContent = 'Cargando…';
  try {
    const d = L.completos ? await leerUrl(L.url, L.pagina + 1) : await leerUrl(L.siguiente);
    L.pagina = d.pagina || L.pagina + 1; L.hayMas = d.hayMas; L.siguiente = d.siguiente;
    const antes = L.productos.length; anadirLote(d.productos || []);
    if (L.productos.length === antes) L.hayMas = false;
    const y = window.scrollY; pintarLote(); window.scrollTo(0, y);
  } catch (e) { toast(e.message); b.disabled = false; b.textContent = 'Cargar más productos de esta categoría'; }
}

async function importarUno(p) {
  const o = LOTE.opt;
  let d = p;
  if (!LOTE.completos) { // tiendas que no son Shopify: leemos la ficha para tener todas las fotos y la descripción
    try { const x = await leerUrl(p.url); if (x.tipo === 'producto') d = { ...p, ...x, precio: x.precio != null ? x.precio : p.precio, imagenes: (x.imagenes || []).length ? x.imagenes : p.imagenes }; } catch (e) {}
  }
  const cat = catLote(p), precio = precioSugerido(d.precio, cat);
  if (!precio) throw new Error('el proveedor no muestra precio');
  const slug = `${slugify(d.nombre)}-${Math.random().toString(36).slice(2, 6)}`;
  const fotos = [];
  const fuentes = (d.imagenes || []).slice(0, o.fotos);
  for (let k = 0; k < fuentes.length; k++) {
    if (!o.copiar) { fotos.push(fuentes[k]); continue; }
    try {
      const r = await fetch('/api/imagen?url=' + encodeURIComponent(fuentes[k]), { headers: { Authorization: 'Bearer ' + session.access_token } });
      if (!r.ok) throw new Error('foto');
      fotos.push(await subirFoto(await r.blob(), slug, k));
    } catch (e) { fotos.push(fuentes[k]); } // si no se puede copiar, usamos la del proveedor
  }
  const fila = { slug, nombre: String(d.nombre).slice(0, 250), categoria: cat, estado: estadoLote(d), marca: d.marca || null, precio,
    precio_anterior: AJ.usarPvp && d.pvp && d.pvp > precio ? d.pvp : null, stock: o.stock, descripcion: d.descripcion || '',
    caracteristicas: d.caracteristicas || {}, imagenes: fotos, top: false, publicado: o.publicar && fotos.length > 0 };
  const { data, error } = await sb.from('productos').insert(fila).select('id').single();
  if (error) throw new Error(error.message);
  const { error: e2 } = await sb.from('productos_privado').insert({ producto_id: data.id, coste: d.precio, proveedor: hostDe(d.url), origen_url: d.url, notas: d.sku ? `Ref. proveedor: ${d.sku}` : null });
  if (e2) throw new Error(e2.message);
}

async function importarLote() {
  const L = LOTE, items = L.productos.filter(p => p.sel && !p.ya && visibleLote(p));
  if (!items.length) return;
  if (!confirm(`¿Importar ${items.length} producto${items.length === 1 ? '' : 's'}${L.opt.publicar ? ' y publicarlos' : ' como borrador'}?`)) return;
  L.corriendo = true; L.parar = false; L.hechos = 0; L.errores = []; L.total = items.length;
  pintarLote();
  let i = 0;
  const trabajador = async () => {
    while (i < items.length && !L.parar) {
      const p = items[i++];
      try { await importarUno(p); p.ya = true; p.sel = false; L.hechos++; }
      catch (e) { L.errores.push(`${String(p.nombre).slice(0, 60)}: ${e.message}`); }
      pintarProgreso();
    }
  };
  await Promise.all([trabajador(), trabajador(), trabajador()]);
  L.corriendo = false; L.total = L.hechos + L.errores.length;
  await cargar();
  if (vista === 'lote' && LOTE === L) { const y = window.scrollY; pintarLote(); window.scrollTo(0, y); }
  toast(`${L.hechos} producto${L.hechos === 1 ? '' : 's'} importado${L.hechos === 1 ? '' : 's'}${L.errores.length ? `, ${L.errores.length} con error` : ''}`);
}

function abrirEditor(x) { ed = x; window.scrollTo(0, 0); pintar(); }
window.addEventListener('beforeunload', e => { if (LOTE && LOTE.corriendo) { e.preventDefault(); e.returnValue = ''; } });

          <label class="f">Coste (lo que pagas) · solo lo ves tú<input class="in" name="coste" inputmode="decimal" value="${esc(e.coste)}" placeholder="0,00"></label>

        </div>
        <div class="small" id="sug"></div>

      </div>

      <div class="card stack">
        <h2 style="font-size:18px">Datos internos <span class="small" style="font-weight:500">· solo los ves tú</span></h2>

    else if (nOrNull(ed.precio) === sg) box.innerHTML = `Precio con tu margen (${margenDe(ed.categoria)} % ${ivaTxt()}) ✓`;
    else box.innerHTML = `Con tu margen (${margenDe(ed.categoria)} % ${ivaTxt()}) sería <strong>${eur(sg)}</strong> · <button type="button" id="usarSug" class="btn b-ghost" style="min-height:36px;padding:0 12px;font-size:13px">Usar este precio</button>`;

const slugify = t => String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 70) || 'producto';

/* Reduce la foto a 1600 px y la guarda en JPG o WebP */
async function optimizar(blob) {
  try {
    if (!/^image\/(jpeg|png|webp|heic|heif)/.test(blob.type) && blob.type) return blob;
    const bmp = await createImageBitmap(blob);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    if (k === 1 && blob.size < 600000 && /jpeg|webp/.test(blob.type)) return blob;
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || blob), 'image/jpeg', 0.86));
  } catch (e) { return blob; }
}

async function subirFoto(blob, slug, i) {
  blob = await optimizar(blob);
  const ext = (blob.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg').replace(/[^a-z0-9]/g, '') || 'jpg';
  const path = `${slug}/${Date.now()}-${i}.${ext}`;
  const { error } = await sb.storage.from('productos').upload(path, blob, { contentType: blob.type || 'image/jpeg', cacheControl: '31536000', upsert: false });
  if (error) throw error;
  return sb.storage.from('productos').getPublicUrl(path).data.publicUrl;
}

async function guardar() {
  const e = ed, st = $('#estadoGuardar'), btn = $('#guardar');
  const precio = nOrNull(e.precio), ant = nOrNull(e.precio_anterior), stock = parseInt(e.stock, 10);
  const errores = [];
  if (!e.nombre.trim()) errores.push('Escribe el nombre del producto.');
  if (precio == null || precio <= 0) errores.push('Pon un precio de venta.');
  if (ant != null && ant <= precio) errores.push('El precio tachado tiene que ser mayor que el precio de venta (o déjalo vacío).');
  if (isNaN(stock) || stock < 0) errores.push('El stock tiene que ser un número.');
  if (e.publicado && !e.imagenes.length) errores.push('Añade al menos una foto antes de publicar.');
  if (errores.length) { st.innerHTML = `<div class="msg err">${errores.map(esc).join('<br>')}</div>`; st.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }

  btn.disabled = true; btn.textContent = 'Guardando…'; st.innerHTML = '';
  try {
    const slug = e.slug || `${slugify(e.nombre)}-${Math.random().toString(36).slice(2, 6)}`;
    const fotos = []; let fallos = 0;
    for (let i = 0; i < e.imagenes.length; i++) {
      const im = e.imagenes[i];
      if (im.guardada) { fotos.push(im.src); continue; }
      btn.textContent = `Subiendo fotos ${i + 1}/${e.imagenes.length}…`;
      try {
        let blob = im.file;
        if (!blob) {
          const r = await fetch('/api/imagen?url=' + encodeURIComponent(im.src), { headers: { Authorization: 'Bearer ' + session.access_token } });
          if (!r.ok) throw new Error('descarga');
          blob = await r.blob();
        }
        const url = await subirFoto(blob, slug, i);
        e.imagenes[i] = { src: url, guardada: true };
        fotos.push(url);
      } catch (err) { fallos++; }
    }
    btn.textContent = 'Guardando…';
    const caracteristicas = {};
    e.specs.split('\n').forEach(l => { const i = l.indexOf(':'); if (i > 0) { const k = l.slice(0, i).trim(), v = l.slice(i + 1).trim(); if (k && v) caracteristicas[k] = v; } });
    const fila = { slug, nombre: e.nombre.trim(), categoria: e.categoria, estado: e.estado, marca: e.marca.trim() || null, precio, precio_anterior: ant, stock,
      descripcion: e.descripcion.trim(), caracteristicas, imagenes: fotos, top: e.top, publicado: e.publicado && fotos.length > 0 };
    let id = e.id;
    if (id) { const { error } = await sb.from('productos').update(fila).eq('id', id); if (error) throw error; }
    else { const { data, error } = await sb.from('productos').insert(fila).select('id').single(); if (error) throw error; id = data.id; }
    const { error: e2 } = await sb.from('productos_privado').upsert({ producto_id: id, coste: nOrNull(e.coste), proveedor: e.proveedor.trim() || null, origen_url: e.origen_url.trim() || null, notas: e.notas.trim() || null });
    if (e2) throw e2;
    await cargar();
    ed = null; vista = 'lista'; pintar();
    toast(fallos ? `Guardado. ${fallos} foto${fallos > 1 ? 's' : ''} no se ${fallos > 1 ? 'han' : 'ha'} podido copiar.` : fila.publicado ? 'Guardado y publicado' : 'Guardado como borrador');
  } catch (err) {
    btn.disabled = false; btn.textContent = 'Guardar';
    st.innerHTML = `<div class="msg err">No se ha podido guardar: ${esc(err.message || err)}</div>`;
  }
}

async function borrar() {
  if (!confirm('¿Borrar este producto? No se puede deshacer.')) return;
  const e = ed;
  const rutas = (e.imagenes || []).filter(i => i.guardada && i.src.includes('/storage/v1/object/public/productos/')).map(i => decodeURIComponent(i.src.split('/storage/v1/object/public/productos/')[1]));
  const { error } = await sb.from('productos').delete().eq('id', e.id);
  if (error) return toast('No se ha podido borrar');
  if (rutas.length) await sb.storage.from('productos').remove(rutas);
  await cargar(); ed = null; pintar(); toast('Producto borrado');
}

/* ---------- Navegación ---------- */
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  if (LOTE && LOTE.corriendo) return toast('Espera a que termine la importación o pulsa Parar');
  if (ed && ed.importado && !ed.id && !confirm('¿Salir sin guardar este producto?')) return;
  ed = null; vista = b.dataset.v; pintar();
});
$('#salir').onclick = async () => { await sb.auth.signOut(); session = null; ed = null; pintarLogin(); };
iniciar();
